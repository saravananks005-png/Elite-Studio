<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Elite Studio -Login</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container glass fade-slide">
<h1 class="logo glow-text">Elite Studio</h1>\
<P class="subtitle">Create Your Elite Account</p>
<input type="email" id="email" placeholder="Email">
<input type="password" id="password" placeholder="Password">
<div class="checkbox-area">
<input type="checkbox" id="agree">
<label>I agree to <a href="privacy.html">Privacy
policy</a></label>
</div>
<button id="registerBtn" class="btn-glow">Create Account</button>
<button id="loginBtn" class="btn-glow">Login</button>
<p id="verificationMessage" class="success-text"></p>
<p class="rest-link" id="restpassword">Forget Password</p>
</div>
<script type="module" src="script.js></script>
</body>
</html>
