<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Elite Studio</title>
<link rel="stylesheet" href="style.css"
</head>
<body>
<div class="container glass fade-slide">
<h1 class="logo glow-text">Elite Dashboard</h1>
<p id="welcomeUser"></p>
<div class="order-box slide-up">
<h3>Pre-Order Editing Service</h3>
<input type="text" id="fullname" placeholder="Full Name">
<input type="text" id="address" placeholder="Address">
<input type="text" id="contactnumber" placeholder="Contact Number"
<select id="servicetype"
<option value="">Select Service</option>
<option value="Photo Editing">Photo Editing</option>
<option value="Video Editing">Video Editing</option>
<option value="Reel Making">Reels Making</option>
<option value="Card Designing">Card Designing</option>
<p id="priceDisplay" class="price-animate"></p>
<textarea id="orderdesciption" placeholder="Describe your editing needs"></textarea>
<button id="logoutBtn" class="btn-glow">Logout</button>
</div>
</body>
</html>
